version: '3.9'

services:

  postgis:
    image: geonode/postgis:13
    ports:
      - "25432:5432"
    volumes:
      - /srv/docker/geoserver/postgis:/var/lib/postgresql
    #volumes_from:
      #- pgstore
    healthcheck:
      test: "pg_isready -d postgres -U postgres"
    restart: on-failure

  geoserver:
    image: geonode/geoserver:2.28.x-latest
    build:
      context: .
    links:
      - postgis
    ports:
      - "8080:8080"
    volumes:
      - geoserver_data_dir:/geoserver_data/data
    environment:
      - NGINX_BASE_URL=http://localhost
      # - GEOSERVER_CORS_ENABLED=true
      # - FORCE_REINIT=true
      # - GEOSERVER_HOME=/tmp
    # Run rootless: any UID works, if the group is 0. Remove it to run as root.
    user: "1000:0"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      # the REST API needs authentication, so check the web UI page
      test: curl --fail -s http://localhost:8080/geoserver/index.html || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 3
    restart: on-failure

volumes:
  # reference to the named data container that holds the preloaded geoserver data directory
  geoserver_data_dir:
